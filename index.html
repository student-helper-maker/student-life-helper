<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student Life Helper</title>

<style>
*{
    box-sizing:border-box;
    margin:0;
    padding:0;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#0f172a,#312e81,#581c87);
    color:white;
}

header{
    text-align:center;
    padding:25px 15px;
    background:rgba(0,0,0,.25);
}

header h1{
    font-size:clamp(28px,7vw,45px);
}

.editor{
    margin-top:7px;
    color:#c4b5fd;
}

nav{
    display:flex;
    justify-content:center;
    gap:10px;
    padding:15px;
    flex-wrap:wrap;
}

nav button{
    border:0;
    padding:12px 22px;
    border-radius:12px;
    background:#6366f1;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.container{
    width:min(1100px,94%);
    margin:auto;
}

.section{
    display:none;
}

.section.active{
    display:block;
}

.card{
    background:rgba(255,255,255,.09);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    padding:22px;
    border-radius:20px;
    margin-bottom:25px;
}

input,select{
    width:100%;
    padding:13px;
    margin:7px 0 13px;
    border:0;
    border-radius:10px;
    background:white;
    color:#111;
}

.primary{
    width:100%;
    border:0;
    padding:14px;
    border-radius:12px;
    background:linear-gradient(90deg,#22c55e,#06b6d4);
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

.subject{
    padding:15px;
    margin:10px 0;
    border-radius:15px;
    background:rgba(0,0,0,.18);
}

/* =========================
   BEAUTIFUL RESULT
========================= */

.result-box{
    margin-top:25px;
    padding:25px;
    border-radius:25px;
    background:linear-gradient(145deg,#111827,#312e81);
    border:2px solid rgba(255,255,255,.15);
    box-shadow:0 15px 45px rgba(0,0,0,.35);
    animation:resultAppear .5s ease;
}

@keyframes resultAppear{
    from{
        opacity:0;
        transform:translateY(25px) scale(.97);
    }
    to{
        opacity:1;
        transform:translateY(0) scale(1);
    }
}

.result-title{
    text-align:center;
    font-size:28px;
    margin-bottom:20px;
}

.student-name{
    text-align:center;
    color:#c4b5fd;
    margin-bottom:20px;
}

/* Percentage Circle */

.percentage-circle{
    width:170px;
    height:170px;
    margin:20px auto;
    border-radius:50%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    background:
        radial-gradient(circle,#111827 57%,transparent 58%),
        conic-gradient(#22c55e var(--percent),#334155 0);
    box-shadow:0 0 30px rgba(34,197,94,.3);
}

.percentage-number{
    font-size:35px;
    font-weight:bold;
}

.percentage-label{
    color:#cbd5e1;
    font-size:13px;
}

/* Result Cards */

.stats{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:12px;
    margin-top:20px;
}

.stat-card{
    padding:17px 10px;
    border-radius:15px;
    text-align:center;
    background:rgba(255,255,255,.08);
}

.stat-card small{
    color:#cbd5e1;
}

.stat-card strong{
    display:block;
    margin-top:6px;
    font-size:22px;
}

.grade{
    color:#facc15;
}

.total{
    color:#38bdf8;
}

.status-pass{
    color:#4ade80;
}

.status-fail{
    color:#f87171;
}

/* Subjects */

.subject-result{
    margin-top:20px;
}

.subject-result h3{
    margin-bottom:10px;
}

.subject-card{
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:14px;
    margin:8px 0;
    border-radius:12px;
    background:rgba(255,255,255,.07);
}

.subject-card.pass{
    border-left:5px solid #22c55e;
}

.subject-card.fail{
    border-left:5px solid #ef4444;
}

.subject-percent{
    font-weight:bold;
}

.result-buttons{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
    margin-top:20px;
}

.result-buttons button{
    border:0;
    padding:13px;
    border-radius:12px;
    color:white;
    font-weight:bold;
    cursor:pointer;
}

.detail-btn{
    background:#6366f1;
}

.print-btn{
    background:#0891b2;
}

/* Planner */

.planner-tabs{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:8px;
    margin:15px 0;
}

.planner-tabs button{
    padding:12px 5px;
    border:0;
    border-radius:10px;
    background:#334155;
    color:white;
}

.planner-tabs button.active{
    background:#7c3aed;
}

.task{
    background:rgba(255,255,255,.08);
    padding:14px;
    margin:10px 0;
    border-radius:12px;
    display:flex;
    justify-content:space-between;
    gap:10px;
}

.task.done{
    opacity:.5;
    text-decoration:line-through;
}

.task-actions button{
    border:0;
    padding:8px;
    border-radius:7px;
    color:white;
    background:#2563eb;
}

.task-actions .delete{
    background:#dc2626;
}

footer{
    text-align:center;
    padding:25px;
    color:#cbd5e1;
    font-size:13px;
}

/* Mobile */

@media(max-width:600px){

    nav{
        display:grid;
        grid-template-columns:1fr 1fr;
    }

    .card{
        padding:16px;
    }

    .stats{
        grid-template-columns:1fr;
    }

    .result-buttons{
        grid-template-columns:1fr;
    }

    .subject-card{
        flex-direction:column;
        align-items:flex-start;
        gap:6px;
    }

    .planner-tabs{
        grid-template-columns:1fr 1fr;
    }

    .task{
        flex-direction:column;
    }
}
</style>
</head>

<body>

<header>
    <h1>📚 Student Life Helper</h1>
    <div class="editor">
        Editor: <strong>Pratyush Sharma</strong>
    </div>
</header>

<nav>
    <button onclick="showSection('calculator')">
        🧮 Percentage
    </button>

    <button onclick="showSection('planner')">
        📅 Planner
    </button>
</nav>

<div class="container">

<section id="calculator" class="section active">

<div class="card">

<h2>🧮 Percentage Calculator</h2>

<label>Student Name</label>
<input id="studentName" placeholder="Enter student name">

<label>Number of Subjects</label>
<input id="subjectCount" type="number" min="1" max="20" value="5">

<button class="primary" onclick="createSubjects()">
Create Subjects
</button>

<div id="subjects"></div>

<button class="primary" onclick="calculateResult()">
Calculate Result 🚀
</button>

<div id="result"></div>

</div>

</section>


<section id="planner" class="section">

<div class="card">

<h2>📅 Student Planner</h2>

<div class="planner-tabs">
<button class="active" onclick="setPlanner('Day',this)">Day</button>
<button onclick="setPlanner('Week',this)">Week</button>
<button onclick="setPlanner('Month',this)">Month</button>
<button onclick="setPlanner('Year',this)">Year</button>
</div>

<h3 id="plannerTitle">Day Planner</h3>

<input id="taskName" placeholder="Enter task">

<select id="taskCategory">
<option>Study</option>
<option>Homework</option>
<option>Exam</option>
<option>Project</option>
<option>Personal</option>
</select>

<input id="taskDate" type="datetime-local">

<button class="primary" onclick="addTask()">
➕ Add Task
</button>

<div id="tasks"></div>

</div>

</section>

</div>

<footer>
Student Life Helper • Editor: Pratyush Sharma
</footer>


<script>

function showSection(id){

    document.querySelectorAll(".section")
    .forEach(x=>x.classList.remove("active"));

    document.getElementById(id).classList.add("active");

    window.scrollTo({
        top:0,
        behavior:"smooth"
    });
}


/* SUBJECT CREATOR */

function createSubjects(){

    const count =
        Number(document.getElementById("subjectCount").value);

    const box =
        document.getElementById("subjects");

    box.innerHTML="";

    if(count<1 || count>20){
        alert("Enter 1 to 20 subjects.");
        return;
    }

    for(let i=1;i<=count;i++){

        box.innerHTML+=`

        <div class="subject">

            <strong>📘 Subject ${i}</strong>

            <input
                class="subjectName"
                placeholder="Subject Name">

            <input
                class="obtained"
                type="number"
                min="0"
                placeholder="Obtained Marks">

            <input
                class="maximum"
                type="number"
                min="1"
                placeholder="Maximum Marks">

        </div>

        `;
    }
}


/* CALCULATE */

let latestResult=null;

function calculateResult(){

    const name =
        document.getElementById("studentName")
        .value.trim() || "Student";

    const names =
        document.querySelectorAll(".subjectName");

    const obtained =
        document.querySelectorAll(".obtained");

    const maximum =
        document.querySelectorAll(".maximum");

    if(names.length===0){
        alert("First create subjects.");
        return;
    }

    let totalObtained=0;
    let totalMaximum=0;
    let passed=true;
    let subjects=[];

    for(let i=0;i<names.length;i++){

        const subject =
            names[i].value.trim() || `Subject ${i+1}`;

        const marks =
            Number(obtained[i].value);

        const max =
            Number(maximum[i].value);

        if(!max || marks<0 || marks>max){

            alert("Please check "+subject+" marks.");
            return;
        }

        const percent=(marks/max)*100;

        if(percent<33){
            passed=false;
        }

        totalObtained+=marks;
        totalMaximum+=max;

        subjects.push({
            name:subject,
            marks:marks,
            max:max,
            percentage:percent
        });
    }

    const percentage =
        totalObtained/totalMaximum*100;

    let grade="F";

    if(percentage>=90) grade="A+";
    else if(percentage>=80) grade="A";
    else if(percentage>=70) grade="B+";
    else if(percentage>=60) grade="B";
    else if(percentage>=50) grade="C";
    else if(percentage>=33) grade="D";

    latestResult={
        name,
        subjects,
        totalObtained,
        totalMaximum,
        percentage,
        grade,
        passed
    };

    /* SUBJECT RESULT */

    let subjectHTML="";

    subjects.forEach(s=>{

        const pass=s.percentage>=33;

        subjectHTML+=`

        <div class="subject-card ${pass?'pass':'fail'}">

            <div>
                <strong>${escapeHTML(s.name)}</strong>
                <br>
                <small>
                    ${s.marks} / ${s.max} marks
                </small>
            </div>

            <div class="subject-percent">
                ${s.percentage.toFixed(1)}%
                ${pass ? "✅" : "❌"}
            </div>

        </div>

        `;
    });


    /* BEAUTIFUL RESULT */

    document.getElementById("result").innerHTML=`

    <div class="result-box">

        <div class="result-title">
            🏆 RESULT CARD
        </div>

        <div class="student-name">
            Student: <strong>
            ${escapeHTML(name)}
            </strong>
        </div>


        <div class="percentage-circle"
             style="--percent:${percentage}%">

            <div class="percentage-number">
                ${percentage.toFixed(1)}%
            </div>

            <div class="percentage-label">
                Percentage
            </div>

        </div>


        <div class="stats">

            <div class="stat-card">
                <small>📊 Total</small>
                <strong class="total">
                    ${totalObtained}/${totalMaximum}
                </strong>
            </div>

            <div class="stat-card">
                <small>🎓 Grade</small>
                <strong class="grade">
                    ${grade}
                </strong>
            </div>

            <div class="stat-card">
                <small>📌 Status</small>

                <strong class="${passed ?
                'status-pass':'status-fail'}">

                    ${passed ? "PASS 🎉":"FAIL"}

                </strong>

            </div>

        </div>


        <div class="subject-result">

            <h3>📚 Subject Performance</h3>

            ${subjectHTML}

        </div>


        <div class="result-buttons">

            <button
                class="detail-btn"
                onclick="openDetailedResult()">

                📄 Detailed Result

            </button>

            <button
                class="print-btn"
                onclick="window.print()">

                🖨️ Save PDF

            </button>

        </div>

    </div>

    `;

    saveResult();
}


/* SAVE */

function saveResult(){

    let data =
        JSON.parse(
            localStorage.getItem("studentResults") || "[]"
        );

    data.push({
        ...latestResult,
        date:new Date().toLocaleString()
    });

    localStorage.setItem(
        "studentResults",
        JSON.stringify(data)
    );
}


/* DETAILED RESULT */

function openDetailedResult(){

    if(!latestResult) return;

    let rows="";

    latestResult.subjects.forEach(s=>{

        rows+=`

        <tr>
            <td>${escapeHTML(s.name)}</td>
            <td>${s.marks}</td>
            <td>${s.max}</td>
            <td>${s.percentage.toFixed(2)}%</td>
        </tr>

        `;
    });

    const page=window.open("","_blank");

    page.document.write(`

    <!DOCTYPE html>

    <html>

    <head>

    <title>Student Result</title>

    <meta name="viewport"
          content="width=device-width,initial-scale=1">

    <style>

    body{
        font-family:Arial;
        padding:25px;
        max-width:900px;
        margin:auto;
        background:#f1f5f9;
    }

    .box{
        background:white;
        padding:25px;
        border-radius:20px;
    }

    h1{
        text-align:center;
        color:#312e81;
    }

    .percentage{
        text-align:center;
        font-size:45px;
        font-weight:bold;
        color:#16a34a;
        margin:20px;
    }

    table{
        width:100%;
        border-collapse:collapse;
        margin-top:20px;
    }

    th,td{
        padding:12px;
        border:1px solid #ccc;
        text-align:center;
    }

    button{
        margin-top:20px;
        padding:13px 20px;
        border:0;
        border-radius:10px;
        background:#4f46e5;
        color:white;
        cursor:pointer;
    }

    </style>

    </head>

    <body>

    <div class="box">

    <h1>🏆 Student Result</h1>

    <h3>
    Student:
    ${escapeHTML(latestResult.name)}
    </h3>

    <div class="percentage">
    ${latestResult.percentage.toFixed(2)}%
    </div>

    <table>

    <tr>
        <th>Subject</th>
        <th>Marks</th>
        <th>Maximum</th>
        <th>Percentage</th>
    </tr>

    ${rows}

    </table>

    <h3 style="margin-top:20px">
    Grade: ${latestResult.grade}
    </h3>

    <h3>
    Status:
    ${latestResult.passed ? "✅ PASS":"❌ FAIL"}
    </h3>

    <button onclick="window.print()">
    🖨️ Save / Print PDF
    </button>

    </div>

    </body>
    </html>

    `);

    page.document.close();
}


/* PLANNER */

let plannerMode="Day";

function setPlanner(mode,button){

    plannerMode=mode;

    document.querySelectorAll(".planner-tabs button")
    .forEach(x=>x.classList.remove("active"));

    button.classList.add("active");

    document.getElementById("plannerTitle")
    .textContent=mode+" Planner";

    displayTasks();
}

function addTask(){

    const name=
        document.getElementById("taskName")
        .value.trim();

    const category=
        document.getElementById("taskCategory").value;

    const date=
        document.getElementById("taskDate").value;

    if(!name){
        alert("Enter a task.");
        return;
    }

    let tasks=
        JSON.parse(
            localStorage.getItem("studentTasks") || "[]"
        );

    tasks.push({
        id:Date.now(),
        name,
        category,
        date,
        mode:plannerMode,
        done:false
    });

    localStorage.setItem(
        "studentTasks",
        JSON.stringify(tasks)
    );

    document.getElementById("taskName").value="";
    document.getElementById("taskDate").value="";

    displayTasks();
}

function displayTasks(){

    let tasks=
        JSON.parse(
            localStorage.getItem("studentTasks") || "[]"
        );

    tasks=tasks.filter(t=>t.mode===plannerMode);

    const box=document.getElementById("tasks");

    box.innerHTML="";

    tasks.forEach(task=>{

        box.innerHTML+=`

        <div class="task ${task.done?'done':''}">

            <div>
                <strong>
                ${escapeHTML(task.name)}
                </strong>

                <br>

                <small>
                ${escapeHTML(task.category)}
                </small>
            </div>

            <div class="task-actions">

                <button onclick="toggleTask(${task.id})">
                ✓
                </button>

                <button
                class="delete"
                onclick="deleteTask(${task.id})">
                🗑
                </button>

            </div>

        </div>

        `;
    });
}

function toggleTask(id){

    let tasks=
        JSON.parse(
            localStorage.getItem("studentTasks") || "[]"
        );

    tasks=tasks.map(t=>
        t.id===id ? {...t,done:!t.done}:t
    );

    localStorage.setItem(
        "studentTasks",
        JSON.stringify(tasks)
    );

    displayTasks();
}

function deleteTask(id){

    let tasks=
        JSON.parse(
            localStorage.getItem("studentTasks") || "[]"
        );

    tasks=tasks.filter(t=>t.id!==id);

    localStorage.setItem(
        "studentTasks",
        JSON.stringify(tasks)
    );

    displayTasks();
}

function escapeHTML(text){

    return String(text)
    .replaceAll("&","&amp;")
    .replaceAll("<","&lt;")
    .replaceAll(">","&gt;")
    .replaceAll('"',"&quot;")
    .replaceAll("'","&#039;");
}

createSubjects();
displayTasks();

</script>

</body>
</html>
