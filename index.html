<title>Student Life Helper - Percentage Calculator & Planner</title>

<meta name="description"
content="Student Life Helper is a free student tool for percentage calculation, result checking and study planning.">

<meta name="keywords"
content="student life helper, percentage calculator, student planner, marks calculator, study planner">

<meta name="author" content="Pratyush Sharma">

<link rel="icon" href="favicon.png">

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Life Helper</title>

<style>
*{
  box-sizing:border-box;
  margin:0;
  padding:0;
  font-family:Arial, sans-serif;
}

body{
  background:linear-gradient(135deg,#0f172a,#1e293b,#312e81);
  color:white;
  min-height:100vh;
}

header{
  text-align:center;
  padding:22px 15px;
  background:rgba(0,0,0,.25);
  border-bottom:1px solid rgba(255,255,255,.15);
}

header h1{
  font-size:clamp(25px,6vw,42px);
  margin-bottom:7px;
}

.editor{
  color:#c4b5fd;
  font-size:14px;
}

nav{
  display:flex;
  justify-content:center;
  gap:10px;
  padding:15px;
  flex-wrap:wrap;
}

nav button{
  background:#4f46e5;
  color:white;
  border:0;
  padding:11px 18px;
  border-radius:10px;
  cursor:pointer;
  font-weight:bold;
}

nav button:hover{
  background:#6366f1;
}

.container{
  width:min(1100px,94%);
  margin:auto;
  padding:10px 0 40px;
}

.section{
  display:none;
}

.section.active{
  display:block;
}

.card{
  background:rgba(255,255,255,.08);
  backdrop-filter:blur(12px);
  padding:22px;
  border-radius:18px;
  margin-bottom:20px;
  border:1px solid rgba(255,255,255,.12);
  box-shadow:0 10px 30px rgba(0,0,0,.2);
}

.card h2{
  margin-bottom:15px;
}

input,select{
  width:100%;
  padding:12px;
  margin:7px 0 12px;
  border:none;
  border-radius:9px;
  background:#f8fafc;
  color:#111827;
}

button{
  cursor:pointer;
}

.primary{
  width:100%;
  padding:13px;
  border:0;
  border-radius:10px;
  background:#22c55e;
  color:white;
  font-weight:bold;
  font-size:16px;
}

.danger{
  background:#ef4444!important;
}

.subject{
  background:rgba(0,0,0,.15);
  padding:15px;
  border-radius:12px;
  margin:10px 0;
}

.result{
  margin-top:20px;
  padding:18px;
  border-radius:12px;
  background:rgba(0,0,0,.25);
  line-height:1.8;
}

table{
  width:100%;
  border-collapse:collapse;
  margin-top:15px;
}

th,td{
  padding:10px;
  border:1px solid rgba(255,255,255,.2);
  text-align:center;
}

.planner-tabs{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:8px;
  margin-bottom:15px;
}

.planner-tabs button{
  padding:12px 5px;
  border:0;
  border-radius:9px;
  background:#334155;
  color:white;
}

.planner-tabs button.active{
  background:#7c3aed;
}

.task{
  background:rgba(255,255,255,.08);
  padding:14px;
  margin:10px 0;
  border-radius:12px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.task.done{
  opacity:.55;
  text-decoration:line-through;
}

.task-info{
  flex:1;
}

.task-actions{
  display:flex;
  gap:5px;
}

.task-actions button{
  border:0;
  padding:8px 10px;
  border-radius:7px;
  color:white;
  background:#2563eb;
}

.task-actions .delete{
  background:#dc2626;
}

footer{
  text-align:center;
  padding:25px;
  color:#cbd5e1;
  font-size:13px;
}

@media(max-width:600px){
  header{
    padding:18px 10px;
  }

  .card{
    padding:16px;
  }

  nav{
    display:grid;
    grid-template-columns:1fr 1fr;
  }

  nav button{
    width:100%;
  }

  .planner-tabs{
    grid-template-columns:1fr 1fr;
  }

  .task{
    align-items:flex-start;
    flex-direction:column;
  }

  .task-actions{
    width:100%;
  }

  .task-actions button{
    flex:1;
  }

  table{
    font-size:12px;
  }

  th,td{
    padding:7px 4px;
  }
}
</style>
</head>

<body>

<header>
  <h1>📚 Student Life Helper</h1>
  <div class="editor">Editor: <strong>Pratyush Sharma</strong></div>
</header>

<nav>
  <button onclick="showSection('calculator')">🧮 Percentage</button>
  <button onclick="showSection('planner')">📅 Planner</button>
</nav>

<div class="container">

<!-- CALCULATOR -->
<section id="calculator" class="section active">

<div class="card">
<h2>🧮 Percentage Calculator</h2>

<label>Student Name</label>
<input id="studentName" placeholder="Enter student name">

<label>Number of Subjects</label>
<input id="subjectCount" type="number" min="1" max="20" value="5">

<button class="primary" onclick="createSubjects()">
Create Subjects
</button>

<div id="subjects"></div>

<button class="primary" onclick="calculateResult()">
Calculate Result
</button>

<div id="result"></div>
</div>

</section>


<!-- PLANNER -->
<section id="planner" class="section">

<div class="card">

<h2>📅 Student Planner</h2>

<div class="planner-tabs">
<button onclick="setPlanner('Day',this)" class="active">Day</button>
<button onclick="setPlanner('Week',this)">Week</button>
<button onclick="setPlanner('Month',this)">Month</button>
<button onclick="setPlanner('Year',this)">Year</button>
</div>

<h3 id="plannerTitle">Day Planner</h3>

<input id="taskName" placeholder="Enter task">

<select id="taskCategory">
<option>Study</option>
<option>Homework</option>
<option>Exam</option>
<option>Project</option>
<option>Personal</option>
</select>

<input id="taskDate" type="datetime-local">

<button class="primary" onclick="addTask()">
➕ Add Task
</button>

<div id="tasks"></div>

</div>
</section>

</div>

<footer>
Student Life Helper • Editor: Pratyush Sharma
</footer>


<script>

/* ---------------- NAVIGATION ---------------- */

function showSection(id){

  document.querySelectorAll(".section")
  .forEach(section=>{
    section.classList.remove("active");
  });

  document.getElementById(id).classList.add("active");

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });
}


/* ---------------- SUBJECTS ---------------- */

function createSubjects(){

  const count =
    Number(document.getElementById("subjectCount").value);

  const box =
    document.getElementById("subjects");

  box.innerHTML="";

  if(count<1 || count>20){
    alert("Enter subjects between 1 and 20.");
    return;
  }

  for(let i=1;i<=count;i++){

    box.innerHTML += `

      <div class="subject">

        <strong>Subject ${i}</strong>

        <input
          class="subjectName"
          placeholder="Subject name"
        >

        <input
          class="obtained"
          type="number"
          min="0"
          placeholder="Obtained Marks"
        >

        <input
          class="maximum"
          type="number"
          min="1"
          placeholder="Maximum Marks"
        >

      </div>

    `;
  }
}


/* ---------------- CALCULATOR ---------------- */

let latestResult=null;

function calculateResult(){

  const name =
    document.getElementById("studentName").value.trim()
    || "Student";

  const names =
    document.querySelectorAll(".subjectName");

  const obtained =
    document.querySelectorAll(".obtained");

  const maximum =
    document.querySelectorAll(".maximum");

  if(names.length===0){
    alert("First click Create Subjects.");
    return;
  }

  let totalObtained=0;
  let totalMaximum=0;
  let passed=true;
  let subjects=[];

  for(let i=0;i<names.length;i++){

    const subject =
      names[i].value.trim() || `Subject ${i+1}`;

    const marks =
      Number(obtained[i].value);

    const max =
      Number(maximum[i].value);

    if(!max || marks<0 || marks>max){

      alert(`Check marks for ${subject}.`);
      return;
    }

    const percentage=(marks/max)*100;

    if(percentage<33){
      passed=false;
    }

    totalObtained+=marks;
    totalMaximum+=max;

    subjects.push({
      name:subject,
      marks:marks,
      max:max,
      percentage:percentage
    });
  }

  const percentage =
    (totalObtained/totalMaximum)*100;

  let grade="F";

  if(percentage>=90) grade="A+";
  else if(percentage>=80) grade="A";
  else if(percentage>=70) grade="B+";
  else if(percentage>=60) grade="B";
  else if(percentage>=50) grade="C";
  else if(percentage>=33) grade="D";

  latestResult={
    name,
    subjects,
    totalObtained,
    totalMaximum,
    percentage,
    grade,
    passed
  };

  document.getElementById("result").innerHTML=`

    <div class="result">

      <h2>📊 Result</h2>

      <p><strong>Name:</strong> ${escapeHTML(name)}</p>

      <p>
        <strong>Total:</strong>
        ${totalObtained} / ${totalMaximum}
      </p>

      <p>
        <strong>Percentage:</strong>
        ${percentage.toFixed(2)}%
      </p>

      <p>
        <strong>Grade:</strong>
        ${grade}
      </p>

      <p>
        <strong>Status:</strong>
        ${passed ? "✅ PASS" : "❌ FAIL"}
      </p>

      <button class="primary"
      onclick="openDetailedResult()">
      📄 View Detailed Result
      </button>

      <br><br>

      <button class="primary"
      onclick="window.print()">
      🖨️ Print / Save PDF
      </button>

    </div>

  `;

  saveResult();
}


/* ---------------- SAVE RESULT ---------------- */

function saveResult(){

  if(!latestResult) return;

  let saved =
    JSON.parse(localStorage.getItem("studentResults") || "[]");

  saved.push({
    ...latestResult,
    date:new Date().toLocaleString()
  });

  localStorage.setItem(
    "studentResults",
    JSON.stringify(saved)
  );
}


/* ---------------- DETAILED RESULT ---------------- */

function openDetailedResult(){

  if(!latestResult) return;

  let rows="";

  latestResult.subjects.forEach(s=>{

    rows += `
      <tr>
        <td>${escapeHTML(s.name)}</td>
        <td>${s.marks}</td>
        <td>${s.max}</td>
        <td>${s.percentage.toFixed(2)}%</td>
      </tr>
    `;

  });

  const page=window.open("","_blank");

  page.document.write(`

  <!DOCTYPE html>

  <html>

  <head>

  <title>Student Result</title>

  <meta name="viewport"
  content="width=device-width,initial-scale=1">

  <style>

  body{
    font-family:Arial;
    padding:25px;
    max-width:900px;
    margin:auto;
  }

  h1{
    text-align:center;
  }

  table{
    width:100%;
    border-collapse:collapse;
    margin-top:20px;
  }

  th,td{
    border:1px solid #333;
    padding:10px;
    text-align:center;
  }

  .summary{
    margin-top:20px;
    padding:15px;
    background:#eee;
  }

  button{
    padding:12px 20px;
    margin-top:20px;
  }

  @media(max-width:600px){
    body{padding:12px}
    table{font-size:12px}
  }

  </style>

  </head>

  <body>

  <h1>📚 Student Result</h1>

  <h3>
  Student: ${escapeHTML(latestResult.name)}
  </h3>

  <table>

  <tr>
    <th>Subject</th>
    <th>Marks</th>
    <th>Maximum</th>
    <th>%</th>
  </tr>

  ${rows}

  </table>

  <div class="summary">

  <h3>Final Result</h3>

  <p>
  Total:
  ${latestResult.totalObtained}
  /
  ${latestResult.totalMaximum}
  </p>

  <p>
  Percentage:
  ${latestResult.percentage.toFixed(2)}%
  </p>

  <p>
  Grade:
  ${latestResult.grade}
  </p>

  <p>
  Status:
  ${latestResult.passed ? "PASS" : "FAIL"}
  </p>

  </div>

  <button onclick="window.print()">
  Save / Print PDF
  </button>

  </body>

  </html>

  `);

  page.document.close();
}


/* ---------------- PLANNER ---------------- */

let plannerMode="Day";

function setPlanner(mode,button){

  plannerMode=mode;

  document.querySelectorAll(".planner-tabs button")
  .forEach(btn=>{
    btn.classList.remove("active");
  });

  button.classList.add("active");

  document.getElementById("plannerTitle")
  .textContent=mode+" Planner";

  displayTasks();
}


function addTask(){

  const name =
    document.getElementById("taskName").value.trim();

  const category =
    document.getElementById("taskCategory").value;

  const date =
    document.getElementById("taskDate").value;

  if(!name){
    alert("Enter a task.");
    return;
  }

  let tasks =
    JSON.parse(localStorage.getItem("studentTasks") || "[]");

  tasks.push({
    id:Date.now(),
    name,
    category,
    date,
    mode:plannerMode,
    done:false
  });

  localStorage.setItem(
    "studentTasks",
    JSON.stringify(tasks)
  );

  document.getElementById("taskName").value="";
  document.getElementById("taskDate").value="";

  displayTasks();
}


function displayTasks(){

  let tasks =
    JSON.parse(localStorage.getItem("studentTasks") || "[]");

  tasks =
    tasks.filter(t=>t.mode===plannerMode);

  const box =
    document.getElementById("tasks");

  box.innerHTML="";

  if(tasks.length===0){

    box.innerHTML=
    `<p style="margin-top:20px;color:#cbd5e1">
    No tasks added yet.
    </p>`;

    return;
  }

  tasks.forEach(task=>{

    box.innerHTML += `

    <div class="task ${task.done ? "done":""}">

      <div class="task-info">

        <strong>
        ${escapeHTML(task.name)}
        </strong>

        <br>

        <small>
        ${escapeHTML(task.category)}
        ${task.date ? " • "+formatDate(task.date):""}
        </small>

      </div>

      <div class="task-actions">

        <button
        onclick="toggleTask(${task.id})">
        ✓
        </button>

        <button
        class="delete"
        onclick="deleteTask(${task.id})">
        🗑
        </button>

      </div>

    </div>

    `;

  });
}


function toggleTask(id){

  let tasks =
    JSON.parse(localStorage.getItem("studentTasks") || "[]");

  tasks=tasks.map(t=>
    t.id===id ? {...t,done:!t.done}:t
  );

  localStorage.setItem(
    "studentTasks",
    JSON.stringify(tasks)
  );

  displayTasks();
}


function deleteTask(id){

  let tasks =
    JSON.parse(localStorage.getItem("studentTasks") || "[]");

  tasks=tasks.filter(t=>t.id!==id);

  localStorage.setItem(
    "studentTasks",
    JSON.stringify(tasks)
  );

  displayTasks();
}


/* ---------------- HELPERS ---------------- */

function formatDate(value){

  const d=new Date(value);

  return d.toLocaleString();
}


function escapeHTML(text){

  return String(text)
  .replaceAll("&","&amp;")
  .replaceAll("<","&lt;")
  .replaceAll(">","&gt;")
  .replaceAll('"',"&quot;")
  .replaceAll("'","&#039;");
}


/* ---------------- START ---------------- */

createSubjects();
displayTasks();

</script>

</body>
</html>
